<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbe3ea">
<title>Abrir en Gmail · Marina Ávila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --ground: #fdf3f6; --ground2: #fbe3ea; --card: #ffffff; --ink: #4a2b35; --soft: #8e6b76;
    --line: rgba(185, 78, 110, .16); --rose: #d9768f; --rose-deep: #b94e6e; --gold: #c9a46a; --gold-soft: #e9d3a8;
    --paper: #fdf3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #24131b; --ground2: #331a26; --card: #2e1822; --ink: #f8e8ee; --soft: #c9a3b1;
      --line: rgba(244, 166, 187, .18); --paper: #3a1f2b;
    }
  }
  * { box-sizing: border-box; }
  /* Sin esto, el display de .btn gana al atributo hidden y los botones ocultos se siguen viendo. */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, var(--ground2), var(--ground) 60%);
    font: 16px/1.5 Jost, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 2rem 16px 2.5rem; }
  .brand { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
  .monogram {
    width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, #f4e4c4, var(--gold)); color: #fff;
    font: 600 1.25rem/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .02em;
    box-shadow: 0 0 0 2px #fff, 0 6px 18px -6px rgba(185, 78, 110, .5);
  }
  .brand b { display: block; font: 600 1.35rem/1.1 "Cormorant Garamond", Georgia, serif; }
  .brand small { color: var(--gold); font-size: .68rem; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 1.6rem; padding: 1.25rem;
    box-shadow: 0 24px 48px -28px rgba(185, 78, 110, .55);
  }
  h1 { font: 600 1.6rem/1.15 "Cormorant Garamond", Georgia, serif; margin: 0 0 .35rem; }
  #who { color: var(--soft); margin: 0 0 1rem; overflow-wrap: anywhere; font-size: .92rem; }
  #preview {
    margin: 0 0 1.1rem; padding: .85rem .95rem; border-radius: 1rem; background: var(--paper);
    border-left: 3px solid var(--gold); max-height: 14rem; overflow-y: auto;
    font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  }
  #preview strong { display: block; margin-bottom: .4rem; font-weight: 600; }
  .btn {
    display: block; width: 100%; padding: .95rem 1rem; margin: 0 0 .65rem; border-radius: 999px;
    border: 1px solid transparent; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
    background: linear-gradient(90deg, #e899ae, var(--rose-deep)); color: #fff;
    box-shadow: 0 10px 22px -12px rgba(185, 78, 110, .8);
  }
  .btn.alt { background: transparent; color: var(--ink); border-color: var(--line); box-shadow: none; font-weight: 500; }
  .btn.alt:active, .btn.alt:hover { background: rgba(217, 118, 143, .08); }
  #hint, #empty { color: var(--soft); font-size: .82rem; margin: 1rem 0 0; text-align: center; }
  .foot { text-align: center; color: var(--gold); font-size: .7rem; letter-spacing: .25em; text-transform: uppercase; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="monogram" aria-hidden="true">MS</span>
    <span><b>Marina Ávila</b><small>Propuesta UGC</small></span>
  </div>
  <section class="card">
    <h1>Tu correo, listo para enviar</h1>
    <p id="who"></p>
    <div id="preview"></div>
    <a id="gmail" class="btn" href="#">Abrir en Gmail</a>
    <a id="mail" class="btn alt" href="#">Abrir en otra app de correo</a>
    <button id="copy" class="btn alt" type="button">Copiar el mensaje</button>
    <p id="hint">Si al pulsar no pasa nada, abre esta página en el navegador del móvil (menú ⋯ o el icono de compartir) y vuelve a pulsar.</p>
    <p id="empty" hidden>Este enlace no trae ningún mensaje.</p>
  </section>
  <p class="foot">Revísalo antes de enviarlo</p>
</main>
<script>
// El mensaje viaja tras la almohadilla del enlace: el navegador no envía esa parte al
// servidor, así que esta página nunca recibe ni guarda nada.
(function () {
  var data = new URLSearchParams(location.hash.slice(1));
  var to = data.get('to') || '', subject = data.get('su') || '', body = data.get('body') || '';
  var noauto = new URLSearchParams(location.search).has('noauto');
  var el = function (id) { return document.getElementById(id); };

  if (!to) {
    ['gmail', 'mail', 'copy', 'hint', 'who', 'preview'].forEach(function (id) { el(id).hidden = true; });
    el('empty').hidden = false;
    return;
  }

  var rest = 'subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  var mailto = 'mailto:' + encodeURIComponent(to).replace(/%40/g, '@') + '?' + rest;
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua);
  var android = /Android/.test(ua);

  // iPhone: la app de Gmail tiene su propio tipo de enlace. Android: mailto, que el móvil
  // entrega a su app de correo (Gmail). Ordenador: Gmail en la web, donde ya hay sesión.
  var gmail = ios ? 'googlegmail://co?to=' + encodeURIComponent(to) + '&' + rest
            : android ? mailto
            : 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to) +
              '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

  el('who').textContent = 'Para ' + to + (subject ? ' · ' + subject : '');
  var title = document.createElement('strong');
  title.textContent = subject;
  el('preview').appendChild(title);
  el('preview').appendChild(document.createTextNode(body));
  el('preview').hidden = !body && !subject;
  el('gmail').href = gmail;
  el('mail').href = mailto;
  el('mail').hidden = (gmail === mailto);

  el('copy').addEventListener('click', function () {
    var text = (subject ? subject + '\n\n' : '') + body;
    var done = function () { el('copy').textContent = 'Copiado ✓'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    } else {
      var area = document.createElement('textarea');
      area.value = text; document.body.appendChild(area); area.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      area.remove();
    }
  });

  // Se intenta abrir solo; si el navegador exige una pulsación, quedan los botones.
  if (!noauto) { setTimeout(function () { location.href = gmail; }, 150); }
})();
</script>
</body>
</html>
